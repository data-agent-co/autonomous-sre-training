apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommend-svc
  namespace: demo-apps
  labels:
    app: recommend-svc
    incident-class: slow-leak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommend-svc
  template:
    metadata:
      labels:
        app: recommend-svc
    spec:
      containers:
        # 1. Main app — clean HTTP service + Prometheus metrics.
        #    ZERO fault-injection code (moved to the leak-fixture sidecar).
        - name: recommend-svc
          image: recommend-svc:demo
          imagePullPolicy: IfNotPresent
          command: ["python"]
          args: ["main.py"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5

        # 2. Fault-as-fixture sidecar — runs leak.py.
        #    LEAK_RATE_MB_PER_MIN=0 (default) → idle.
        #    trigger-leak.sh / trigger-slowleak.sh set it to N via `kubectl set env`.
        #    128Mi limit → OOM ~30s after trigger-leak.sh (280 MB/min),
        #    ~6min after trigger-slowleak.sh (20 MB/min).
        - name: leak-fixture
          image: recommend-svc:demo
          imagePullPolicy: IfNotPresent
          command: ["python"]
          args: ["leak.py"]
          env:
            - name: LEAK_RATE_MB_PER_MIN
              value: "0"
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: recommend-svc
  namespace: demo-apps
  labels:
    app: recommend-svc
spec:
  selector:
    app: recommend-svc
  ports:
    - name: http
      port: 80
      targetPort: 8080
