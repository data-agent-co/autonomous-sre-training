apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-svc
  namespace: demo-apps
  labels:
    app: catalog-svc
    incident-class: healthy-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-svc
  template:
    metadata:
      labels:
        app: catalog-svc
    spec:
      containers:
        - name: nginx
          image: nginx:1.30.5-alpine3.24
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-svc
  namespace: demo-apps
spec:
  selector:
    app: catalog-svc
  ports:
    - port: 80
      targetPort: 80
