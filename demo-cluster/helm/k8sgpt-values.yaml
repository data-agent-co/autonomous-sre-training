# k8sgpt-operator values. The K8sGPT CR itself is applied separately
# (manifests/k8sgpt/k8sgpt-cr.yaml) so we can keep secrets out of values.

controllerManager:
  manager:
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 500m

serviceMonitor:
  enabled: true
  # release label is what kube-prometheus-stack's Prometheus selects on.
  # Without it, Prometheus would ignore the K8sGPT operator's metrics.
  additionalLabels:
    release: prometheus-stack
