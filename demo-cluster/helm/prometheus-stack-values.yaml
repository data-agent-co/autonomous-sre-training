# kube-prometheus-stack values tuned for a laptop demo cluster.
# Disables the heavy bits we don't need; keeps Prometheus, Alertmanager,
# kube-state-metrics, and node-exporter. Dashboards run in the demo
# dashboard (dashboard/) and in Perses (helm/perses-values.yaml), so the
# chart's bundled dashboard UI is off.

grafana:
  enabled: false

prometheus:
  prometheusSpec:
    # Demo-tuned 5s scrape for snappy dashboard updates. Production deployments
    # typically use 15-30s. Increases storage ~6x and CPU ~2x on Prometheus but
    # is fine for a laptop kind cluster with our small target count.
    scrapeInterval: 5s
    evaluationInterval: 5s
    retention: 6h
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 768Mi
        cpu: 750m
    # The demo apps are scraped through their ServiceMonitors
    # (manifests/*/servicemonitor.yaml); pod memory comes from cAdvisor and
    # kube-state-metrics.

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        memory: 64Mi
        cpu: 20m
      limits:
        memory: 128Mi
        cpu: 100m

# Exports one k8sgpt_result_info series per K8sGPT Result object, for the
# dashboards' "K8sGPT new Results" and "K8sGPT diagnoses by Kind" panels. The
# operator's own k8sgpt_number_of_results gauge cannot be used: it keeps its
# last count after the Results are deleted.
kube-state-metrics:
  rbac:
    extraRules:
      - apiGroups: [core.k8sgpt.ai]
        resources: [results]
        verbs: [list, watch]
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind:
              group: core.k8sgpt.ai
              version: v1alpha1
              kind: Result
            metricNamePrefix: k8sgpt_result
            labelsFromPath:
              name: [metadata, name]
              result_namespace: [metadata, namespace]
            metrics:
              - name: info
                help: One series per K8sGPT Result, with the flagged object and the LLM backend.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      kind: [spec, kind]
                      object: [spec, name]
                      backend: [spec, backend]

# Disable bits we don't need on a laptop demo.
kubeApiServer:
  enabled: true
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# Fires within seconds of an OOMKill in demo-apps, minutes before K8sGPT
# reports the pod (its Pod analyzer waits for CrashLoopBackOff). It stays
# firing while the container keeps being OOMKilled at least every 10
# minutes, so a crash loop is one alert. With Slack on, Alertmanager posts it
# through slack-relay (helm/alertmanager-slack-values.yaml).
additionalPrometheusRulesMap:
  demo-oomkill:
    groups:
    - name: demo-apps
      rules:
      - alert: DemoContainerOOMKilled
        expr: |
          increase(kube_pod_container_status_restarts_total{namespace="demo-apps"}[10m]) > 0
          and on (namespace, pod, container)
          kube_pod_container_status_last_terminated_reason{namespace="demo-apps", reason="OOMKilled"} == 1
        labels:
          severity: warning
        annotations:
          summary: Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled
          description: The container went past its memory limit and the kernel killed it; the kubelet restarts it.
