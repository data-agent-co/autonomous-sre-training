# kube-prometheus-stack values tuned for a laptop demo cluster.
# Disables the heavy bits we don't need; keeps Prometheus, Alertmanager,
# kube-state-metrics, and node-exporter. Dashboards run in the demo
# dashboard (dashboard/) and in Perses (helm/perses-values.yaml), so the
# chart's bundled dashboard UI is off.

grafana:
  enabled: false

prometheus:
  prometheusSpec:
    # Demo-tuned 5s scrape for snappy dashboard updates. Production deployments
    # typically use 15-30s. Increases storage ~6x and CPU ~2x on Prometheus but
    # is fine for a laptop kind cluster with our small target count.
    scrapeInterval: 5s
    evaluationInterval: 5s
    retention: 6h
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 768Mi
        cpu: 750m
    # The demo apps are scraped through their ServiceMonitors
    # (manifests/*/servicemonitor.yaml); pod memory comes from cAdvisor and
    # kube-state-metrics.

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        memory: 64Mi
        cpu: 20m
      limits:
        memory: 128Mi
        cpu: 100m

# Exports two metrics from the custom resources of K8sGPT:
#
# - k8sgpt_result_info: one series per K8sGPT Result object, for the
#   dashboards' "K8sGPT new Results" and "K8sGPT diagnoses by Kind" panels
#   and for the control plane in the demo dashboard's topology. The
#   operator's own k8sgpt_number_of_results gauge cannot be used: it keeps
#   its last count after the Results are deleted.
# - k8sgpt_config_ai_info: one series per K8sGPT resource, with three of its
#   LLM settings (spec.ai) as labels: enabled, backend and model. The LLM row
#   of that control plane reads it: nothing else tells Prometheus whether the
#   LLM is on. The API key is not exported: the resource only names the
#   Secret that holds it, and that name is not a label either. Neither is
#   the base URL, which can carry a token of its own.
kube-state-metrics:
  rbac:
    extraRules:
      - apiGroups: [core.k8sgpt.ai]
        resources: [results, k8sgpts]
        verbs: [list, watch]
  customResourceState:
    enabled: true
    config:
      spec:
        resources:
          - groupVersionKind:
              group: core.k8sgpt.ai
              version: v1alpha1
              kind: Result
            metricNamePrefix: k8sgpt_result
            labelsFromPath:
              name: [metadata, name]
              result_namespace: [metadata, namespace]
            metrics:
              - name: info
                help: One series per K8sGPT Result, with the flagged object and the LLM backend.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      kind: [spec, kind]
                      object: [spec, name]
                      backend: [spec, backend]
          - groupVersionKind:
              group: core.k8sgpt.ai
              version: v1alpha1
              kind: K8sGPT
            metricNamePrefix: k8sgpt_config
            labelsFromPath:
              name: [metadata, name]
            metrics:
              - name: ai_info
                help: One series per K8sGPT resource, with its LLM settings. The API key is not exported.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      enabled: [spec, ai, enabled]
                      backend: [spec, ai, backend]
                      model: [spec, ai, model]

# Disable bits we don't need on a laptop demo.
kubeApiServer:
  enabled: true
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# Fires within seconds of an OOMKill in demo-apps, minutes before K8sGPT
# reports the pod (its Pod analyzer waits for CrashLoopBackOff). It stays
# firing while the container keeps being OOMKilled at least every 10
# minutes, so a crash loop is one alert. With Slack on, Alertmanager posts it
# through slack-relay (helm/alertmanager-slack-values.yaml).
additionalPrometheusRulesMap:
  demo-oomkill:
    groups:
    - name: demo-apps
      rules:
      - alert: DemoContainerOOMKilled
        expr: |
          increase(kube_pod_container_status_restarts_total{namespace="demo-apps"}[10m]) > 0
          and on (namespace, pod, container)
          kube_pod_container_status_last_terminated_reason{namespace="demo-apps", reason="OOMKilled"} == 1
        labels:
          severity: warning
        annotations:
          summary: Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled
          description: The container went past its memory limit and the kernel killed it; the kubelet restarts it.
