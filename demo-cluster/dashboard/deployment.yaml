# The demo dashboard: one page with a live topology of the demo apps and the
# panels of web/dashboard.json. scripts/up.sh builds the image from this
# directory, loads it into the cluster and applies this file. It then adds
# the annotation sre-training/image-hash to the pod template, so the pod is
# replaced when the image changed; the live Deployment differs from this
# file by that one annotation.
#
# It runs in `monitoring`, next to Prometheus and Perses, not in `demo-apps`:
# the dashboards count the pods in demo-apps and K8sGPT scans them.
#
# No login and no Ingress: kind/k3d-only demo, reached through a local
# port-forward (scripts/dashboard.sh). Do NOT copy this to a real environment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-dashboard
  namespace: monitoring
  labels:
    app: demo-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-dashboard
  template:
    metadata:
      labels:
        app: demo-dashboard
    spec:
      # The server only talks to Prometheus, never to the Kubernetes API.
      automountServiceAccountToken: false
      # 65532 is the distroless `nonroot` user the image runs as.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-dashboard
          image: demo-dashboard:demo
          imagePullPolicy: IfNotPresent
          env:
            - name: PROMETHEUS_URL
              value: http://prometheus-stack-kube-prom-prometheus.monitoring.svc:9090
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
            # The default 1s is too short while the OOMKill demo loads the node.
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: demo-dashboard
  namespace: monitoring
  labels:
    app: demo-dashboard
spec:
  selector:
    app: demo-dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http
