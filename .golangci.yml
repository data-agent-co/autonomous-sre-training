# golangci-lint v2 configuration for the two Go modules `make lint` checks:
# the watcher (k8s-watcher/) and the demo dashboard (demo-cluster/dashboard/).
# CI uses the same golangci-lint version (see .github/workflows/ci.yml).
version: "2"

run:
  # Paths below are relative to the go.mod of the module being linted.
  relative-path-mode: gomod

linters:
  # errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - durationcheck
    - errname
    - errorlint
    - gocheckcompilerdirectives
    - gocritic
    - loggercheck
    - makezero
    - misspell
    - musttag
    - nilnesserr
    - nolintlint
    - predeclared
    - promlinter
    - reassign
    - usestdlibvars
    - usetesting
    - wastedassign
  exclusions:
    rules:
      # The watcher's main exits non-zero after a lane fails; the deferred
      # signal-context cancel has nothing left to release at that point.
      # No file of the dashboard module has this path.
      - path: cmd/watcher/main\.go
        linters: [gocritic]
        text: exitAfterDefer

formatters:
  enable:
    - gofmt
    - goimports

issues:
  # Report every finding, not the first few per linter.
  max-issues-per-linter: 0
  max-same-issues: 0
